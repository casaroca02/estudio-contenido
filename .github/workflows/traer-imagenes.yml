name: Traer imágenes
# Autorizado por Carlos (4 nov 2026, opción B): el entorno de producción solo llega a GitHub.
# Este flujo descarga fotos y música libres de regalías (música: biblioteca de Orshot, uso comercial sin atribución) (Pixabay/Unsplash vía Orshot) y las imágenes
# oficiales de la marca (exportadas de Canva) listadas en cola/*.txt, y las guarda en el repositorio.
# Formato de cada línea: <url> <ruta destino dentro de marcas/>
on:
  push:
    paths: ['cola/*.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency: traer-imagenes
jobs:
  traer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar y optimizar
        run: |
          pip install --quiet pillow
          shopt -s nullglob
          for f in cola/*.txt; do
            while read -r url destino; do
              [ -z "$url" ] && continue
              case "$destino" in marcas/*) ;; *) echo "destino inválido: $destino"; continue;; esac
              case "$destino" in *..*) echo "destino inválido: $destino"; continue;; esac
              case "$url" in https://storage.orshot.com/*|https://cdn.orshot.com/*|https://export-download.canva.com/*|https://*.canva.com/*|https://cdn.pixabay.com/*|https://images.unsplash.com/*|https://images.pexels.com/*) ;; *) echo "origen no permitido: $url"; continue;; esac
              mkdir -p "$(dirname "$destino")"
              curl -fsSL --max-time 90 "$url" -o /tmp/img || { echo "falló $url"; continue; }
              case "$destino" in *.m4a|*.mp3|*.wav) mv /tmp/img "$destino"; echo "ok audio $destino"; continue;; esac
              python3 -c "
          from PIL import Image, ImageOps; import sys
          d = sys.argv[1]
          im = ImageOps.exif_transpose(Image.open('/tmp/img'))
          im.thumbnail((1600, 1600))
          if d.endswith('.png'):
              im.convert('RGBA').save(d, 'PNG', optimize=True)
          else:
              im.convert('RGB').save(d, 'JPEG', quality=86, optimize=True)" "$destino"
              echo "ok $destino"
            done < "$f"
            git rm -q "$f"
          done
      - name: Guardar
        run: |
          git config user.name "Estudio de contenido"
          git config user.email "estudio@users.noreply.github.com"
          git add -A .
          git diff --cached --quiet || git commit -m "Imágenes descargadas desde la cola"
          git push
